name: Refresh citation counts

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update citation badges
        run: python citation_workflow.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}   # optional
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md citations.json; then
            echo "No citation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md citations.json
          git commit -m "Refresh citation counts"
          git push
